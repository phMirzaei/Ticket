services:

  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ticket-app
    volumes:
      - ./:/var/www
    depends_on:
      - mysql
    networks:
      - ticket

  nginx:
    image: nginx:latest
    container_name: ticket-nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - ticket

  mysql:
    image: mysql:8.0
    container_name: ticket-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ticket
      MYSQL_USER: ticket
      MYSQL_PASSWORD: ticket
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ticket

networks:
  ticket:

volumes:
  mysql_data:
